name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  jetbrains:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jetbrains
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Show Gradle version
        run: gradle -v || true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/notifications
            ~/.gradle/native
          key: ${{ runner.os }}-gradle-${{ hashFiles('jetbrains/**/*.gradle*', 'jetbrains/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build
        run: gradle --no-daemon build

      - name: Run tests
        run: gradle --no-daemon test

      - name: Verify plugin (JetBrains Plugin Verifier)
        run: gradle --no-daemon verifyPlugin
