name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  # Validates shared/ (data + golden fixtures used by both plugins) before either plugin builds.
  shared-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node is preinstalled on GitHub's ubuntu runners
      - name: Validate shared data and golden fixtures against schemas
        run: |
          set -euo pipefail
          validate() { npx --yes ajv-cli@5.0.0 validate --spec=draft7 --errors=text -s "$1" -d "$2"; }
          validate shared/schemas/clipboard-formats.schema.json   shared/data/clipboard-formats.json
          validate shared/schemas/filemaker-functions.schema.json shared/data/filemaker-functions.json
          validate shared/schemas/golden-snippets.schema.json     shared/fixtures/golden/snippets.generated.json
          validate shared/schemas/golden-cases.schema.json        shared/fixtures/golden/cases.json
          validate shared/schemas/fm-calc-catalogue.schema.json   shared/fixtures/calc-catalogue/example.illustrative.json
          npx --yes ajv-cli@5.0.0 validate --spec=draft7 --errors=text -s shared/schemas/calc-language.schema.json \
            -r shared/schemas/fm-calc-catalogue.schema.json -d shared/data/calc-language.json
          if [ -f shared/data/fm-calc-catalogue.json ]; then
            validate shared/schemas/fm-calc-catalogue.schema.json shared/data/fm-calc-catalogue.json
          fi
          if find shared/fixtures/clipboard -name capture.json | grep -q .; then
            find shared/fixtures/clipboard -name capture.json -print0 | while IFS= read -r -d '' f; do
              validate shared/schemas/capture.schema.json "$f"
            done
          fi

      - name: Check generated golden file is up to date
        run: |
          node shared/tools/generate-golden.mjs
          if ! git diff --exit-code -- shared/fixtures/golden/snippets.generated.json; then
            echo "::error::shared/fixtures/golden/snippets.generated.json is stale. Run 'node shared/tools/generate-golden.mjs' and commit the result."
            exit 1
          fi

  jetbrains:
    needs: shared-validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jetbrains
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Show Gradle version
        run: gradle -v || true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/notifications
            ~/.gradle/native
          key: ${{ runner.os }}-gradle-${{ hashFiles('jetbrains/**/*.gradle*', 'jetbrains/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build
        run: gradle --no-daemon build

      - name: Run tests
        run: gradle --no-daemon test

      - name: Verify plugin (JetBrains Plugin Verifier)
        run: gradle --no-daemon verifyPlugin

  vscode:
    needs: shared-validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check generated .fmcalc grammar is up to date
        run: node scripts/generate-grammar.mjs --check

      - name: Check LICENSE matches the repository's
        run: cmp ../LICENSE LICENSE

      - name: Type-check
        run: npm run typecheck

      - name: Unit and shared golden-fixture tests
        run: npm test

      - name: Bundle
        run: npm run build

      - name: Integration tests in VS Code (oldest supported version)
        run: xvfb-run -a npm run test:integration

      - name: Package (.vsix)
        run: npm run package
